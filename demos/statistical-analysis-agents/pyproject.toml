[project]
name = "statistical-analysis-agents"
version = "0.1.0"
description = "Interactive statistical analysis playground for AI Agent evaluation, optimization, and reliability (Chapters 1-8)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.1",
    "plotly>=5.19.0",
    "nbformat>=5.9.0",
    "nbclient>=0.9.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
