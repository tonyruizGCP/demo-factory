[project]
name = "acme-skills-registry-adk"
version = "0.1.0"
description = "Demonstration of consuming Gemini Enterprise Agent Platform Skills Registry within an ADK Agent"
authors = [{ name = "Tony Ruiz", email = "tonyruiz@google.com" }]
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.5.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-genai>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0"
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'"
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
