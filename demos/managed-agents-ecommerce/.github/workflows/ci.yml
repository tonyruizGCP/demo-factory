name: SDLC Quality Gate - Managed Agents E-Commerce

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Check Environment Variable Security & Guardrails
        run: |
          ! grep -rn "GOOGLE_CLOUD_PROJECT" app.py test_managed_agent_curl.py || echo "Warning: Verify GCP_PROJECT is preferred over GOOGLE_CLOUD_PROJECT"

      - name: Run Deterministic Pytest Suite
        run: |
          pytest tests/

      - name: Run Agent Trajectory & Rubric Evals
        run: |
          python3 eval_runner.py --min-score 0.85
