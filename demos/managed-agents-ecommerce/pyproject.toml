[project]
name = "managed-agents-ecommerce"
version = "0.1.0"
description = "Managed Agents API - Unified Commerce Agent Demo"
dependencies = [
    "google-genai>=2.0.0",
    "google-auth>=2.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyopenssl==24.3.0",
    "cryptography==44.0.3"
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
