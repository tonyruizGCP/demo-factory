[project]
name = "adk-ae-oauth"
version = "0.1.0"
description = "ADK Agent Engine + OAuth Google Drive Reader Demo"
dependencies = [
    "google-genai>=2.0.0",
    "google-adk>=0.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyopenssl==24.3.0",
    "cryptography==44.0.3"
]

[tool.uv]
index-strategy = "unsafe-best-match"
