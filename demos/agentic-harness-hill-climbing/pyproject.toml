[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-optimizer"
version = "0.1.0"
description = "Autonomous Evaluation and Hill-Climbing Harness for Agentic Coding Systems"
readme = "README.md"
authors = [
    { name = "Harness Optimizer Team" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
harness-optimizer = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
